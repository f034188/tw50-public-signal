name: Publish market-only 0050 trend site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-trend-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Strict public folder and market payload validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          folder=Path("site")
          items={p.name for p in folder.iterdir() if p.is_file()}
          assert items=={"index.html","market.json"}, "Unexpected file in published site folder"
          report=json.loads((folder/"market.json").read_text(encoding="utf-8"))
          allowed={"schema_version","data_date","generated_at_taipei","display_status",
                   "trend","trend_change","l2_trading","update_quality",
                   "corporate_action_discovery_complete","is_actionable","data_source","purpose"}
          assert set(report)==allowed, "Unexpected field in public market JSON"
          assert report["is_actionable"] is False, "No trade instructions allowed"
          assert report["corporate_action_discovery_complete"] is False
          assert report["schema_version"]=="N43-PUBLIC-MARKET-OBSERVATION-v1"
          assert report["display_status"] in {"BLOCKED","STALE","PAUSED","PARTIAL","SHADOW_OK"}
          html=(folder/"index.html").read_text(encoding="utf-8")
          txt=html+"\n"+(folder/"market.json").read_text(encoding="utf-8")
          for secret in ("N42_PRIVATE","ledger_checkpoint","PRIVATE_ONLY_CANARY",
                         "A_00631L_units","F_0050_units","N41_PRIVATE_MODEL_LEDGER_JSON",
                         "f034188/tw50-signal-pilot","500000","NT$500,000"):
              assert secret not in txt,"Forbidden private-data pattern found"
          print("PUBLIC_SITE_PRIVACY_AND_SCHEMA_PASS")
          PY
      - name: Upload ONLY site/ for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy vetted public pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  anonymous_http_smoke_test:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify unauthenticated public website and market.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/tw50-public-check
          ROOT="https://f034188.github.io/tw50-public-signal/"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            --output /tmp/tw50-public-check/index.html "$ROOT"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            --output /tmp/tw50-public-check/market.json "$ROOT"market.json
          python - <<'PY'
          from pathlib import Path
          import json
          index=Path('/tmp/tw50-public-check/index.html').read_text(encoding='utf-8')
          data=json.loads(Path('/tmp/tw50-public-check/market.json').read_text(encoding='utf-8'))
          assert '<title>台股趨勢觀察' in index, 'Unexpected public HTML'
          assert 'fetch("market.json?' in index, 'Browser market integration missing'
          assert data.get("schema_version")=="N43-PUBLIC-MARKET-OBSERVATION-v1"
          assert data.get("is_actionable") is False
          assert data.get("corporate_action_discovery_complete") is False
          assert set(data)=={"schema_version","data_date","generated_at_taipei",
              "display_status","trend","trend_change","l2_trading",
              "update_quality","corporate_action_discovery_complete",
              "is_actionable","data_source","purpose"}
          for marker in ("ledger_checkpoint","A_00631L_units","F_0050_units",
                         "PRIVATE_ONLY_CANARY","tw50-signal-pilot","500000"):
              assert marker not in index and marker not in json.dumps(data), "Private leakage marker"
          print("ANONYMOUS_PUBLIC_HTTP_200_AND_MARKET_DATA_PASS")
          print("public_data_date="+str(data.get("data_date")))
          print("public_market_status="+str(data.get("display_status")))
          PY
# Contains no private research, API keys, holdings or model account balances.
